description = "Filament-drying riser collar for a stackable food dehydrator"
requires-python = ">=3.12"
dependencies = [
    "build123d>=0.11",
]

[tool.uv]
# Model scripts, not an installable library.
package = false

[dependency-groups]
dev = [
    "watchfiles>=1.2.0",
    "yacv-server>=0.11.3",
]
