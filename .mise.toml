[tools]
python = "3.14"
uv = "latest"

[env]
# uv sync creates and manages .venv using the python above.
UV_PROJECT_ENVIRONMENT = ".venv"

[tasks.setup]
description = "Install/refresh Python dependencies"
run = "uv sync"

[tasks.build]
description = "Build the collar; exports STL and STEP into model/"
run = "uv run python model/collar.py"

[tasks.ring]
description = "Full-perimeter fit test at reduced height; exports ring.stl and .step"
run = "uv run python model/ring.py"

[tasks.coupon]
description = "Build the corner test coupon; exports coupon.stl and .step"
run = "uv run python model/coupon.py"

[tasks.render]
description = "Render the STL to PNGs in model/renders/ (no GPU needed)"
run = "uv run python tools/render.py"

[tasks.docs]
description = "Serve lessons and reference sheets at localhost:8765"
run = "python -m http.server 8765 --bind 127.0.0.1"

[tasks.watch]
description = "Live-reloading browser viewer at localhost:32323"
run = "uv run python tools/watch.py"

[tasks.repl]
description = "IPython shell with build123d loaded"
run = "uv run ipython -i -c 'from build123d import *'"
