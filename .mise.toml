[tools]
python = "3.14"
uv = "latest"

[env]
# uv sync creates and manages .venv using the python above.
UV_PROJECT_ENVIRONMENT = ".venv"

# Puts cadkit on the path for every invocation, including running a model file
# directly. Cheaper than making the workspace an installable package, and it
# keeps `python projects/x/thing.py` working with no editable install to forget
# to refresh.
PYTHONPATH = "{{config_root}}"

[tasks.setup]
description = "Install/refresh Python dependencies"
run = "uv sync"

# raw_args on the tasks below so argparse owns the CLI: `mise build -h`,
# `mise build riser collar -n` and friends pass through untouched.

[tasks.build]
description = "Build a project's models into exports/<project>/ — omit the name to build all"
raw_args = true
run = "uv run python tools/build.py"

[tasks.test]
description = "Build a project's models and run their check() — omit the name to test all"
raw_args = true
run = "uv run python tools/test.py"

# Named `dev`, not `watch`: mise has a built-in `watch` (a watchexec wrapper)
# and built-ins win, so `mise watch <project>` never reached this task — it
# tried to run watchexec on a task named after the project and died there.
[tasks.dev]
description = "Live-reloading browser viewer for one project at localhost:32323"
raw_args = true
run = "uv run python tools/watch.py"

[tasks.render]
description = "Render a project's exported STLs to PNGs (no GPU needed)"
raw_args = true
run = "uv run python tools/render.py"

[tasks.new]
description = "Scaffold a new project folder"
raw_args = true
run = "uv run python tools/new.py"

# Named `format` for the same reason: `mise fmt` is the built-in that formats
# mise.toml itself. That one is the nastier of the two — it shadowed this task
# silently and exited 0, so the workspace looked formatted when ruff had not
# run at all.
[tasks.format]
description = "Format and lint the workspace"
run = ["uv run ruff format .", "uv run ruff check --fix ."]

[tasks.repl]
description = "IPython shell with build123d loaded"
run = "uv run ipython -i -c 'from build123d import *'"
